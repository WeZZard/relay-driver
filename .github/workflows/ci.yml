name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg (media acceptance tests)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: JS/TS tests
        run: npm test

      - name: Python tests (host-sdk-python, script-sdk/relay_script)
        run: |
          PYTHONPATH="packages/host-sdk-python:packages/script-sdk" \
            python3 packages/host-sdk-python/test/test_relay_host.py -v
