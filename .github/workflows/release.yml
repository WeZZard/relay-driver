name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package versions match the tag
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          for dir in core host-sdk remote-runtime script-sdk cli; do
            pkg_version=$(node -p "require('./packages/$dir/package.json').version")
            if [ "$pkg_version" != "$tag_version" ]; then
              echo "packages/$dir is at $pkg_version, but tag $GITHUB_REF_NAME implies $tag_version" >&2
              exit 1
            fi
          done

      - name: Publish packages (dependency order, skip already-published versions)
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          names=(
            "@wezzard/relay-driver-core"
            "@wezzard/relay-driver-host-sdk"
            "@wezzard/relay-driver-remote-runtime"
            "@wezzard/relay-driver-script-sdk"
            "@wezzard/relay-driver-cli"
          )
          dirs=(core host-sdk remote-runtime script-sdk cli)
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            dir="${dirs[$i]}"
            published_version=$(npm view "$name@$tag_version" version 2>/dev/null || true)
            if [ "$published_version" = "$tag_version" ]; then
              echo "skip: $name@$tag_version is already published"
              continue
            fi
            npm publish -w "packages/$dir" --provenance --access public
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "skip: release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
